server:
  port: 8088

spring:
  datasource:
    url: jdbc:mysql://localhost:3312/order_db
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Read-only — this service never writes to the database
    hikari:
      read-only: true
  jpa:
    show-sql: false
    properties:
      hibernate:
        # Prevent any accidental writes
        connection.read_only: true
        hbm2ddl:
          auto: none
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

# NOTE: This service performs READ-ONLY native SQL queries against order_db.
# It never persists, creates, or updates any data.

jwt:
  secret: ${JWT_SECRET}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

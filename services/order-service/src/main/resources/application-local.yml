server:
  port: 8085

spring:
  datasource:
    url: jdbc:h2:mem:order_db;INIT=CREATE SCHEMA IF NOT EXISTS order_db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

app:
  rabbitmq:
    exchange: truckbites.exchange
    routing-key:
      order-placed: order.placed
      order-paid: order.paid
    queue:
      order-paid: order.paid.queue

jwt:
  secret: ${JWT_SECRET}

eureka:
  client:
    enabled: false

server:
  port: 8085

spring:
  datasource:
    url: jdbc:mysql://localhost:3312/order_db
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

app:
  rabbitmq:
    exchange: truckbites.exchange
    routing-key:
      order-placed: order.placed
      order-paid: order.paid
    queue:
      order-paid: order.paid.queue

jwt:
  secret: ${JWT_SECRET}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

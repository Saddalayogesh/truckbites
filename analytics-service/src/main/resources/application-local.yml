server:
  port: 8088

spring:
  datasource:
    url: jdbc:h2:mem:order_db;INIT=CREATE SCHEMA IF NOT EXISTS order_db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        hbm2ddl:
          auto: create-drop

eureka:
  client:
    enabled: false

server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/truckbites_db
    username: root
    password: truckbites_root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${MAILTRAP_HOST:smtp.mailtrap.io}
    port: ${MAILTRAP_PORT:2525}
    username: ${MAILTRAP_USERNAME:your-mailtrap-username}
    password: ${MAILTRAP_PASSWORD:your-mailtrap-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D635166546A576E5A7234753778214125442A47}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    com.truckbites: DEBUG
    org.springframework.security: DEBUG
version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: truckbites-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: truckbites_db
      MYSQL_ROOT_PASSWORD: truckbites_root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ptruckbites_root"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - truckbites-network

  backend:
    build:
      context: ./truckbites-backend
      dockerfile: Dockerfile
    container_name: truckbites-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/truckbites_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: truckbites_root
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - truckbites-network

volumes:
  mysql_data:
    name: truckbites_mysql_data

networks:
  truckbites-network:
    name: truckbites-network
    driver: bridge

version: "3.8"

services:
  # =====================
  # Shared MySQL Database
  # =====================
  mysql:
    image: mysql:8.0
    container_name: truckbites-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: truckbites_db
      MYSQL_ROOT_PASSWORD: truckbites_root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ptruckbites_root"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - truckbites-network

  # ===========================
  # Service Discovery (Eureka)
  # ===========================
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: truckbites-eureka
    restart: unless-stopped
    ports:
      - "8761:8761"
    networks:
      - truckbites-network

  # ============================
  # Centralized Config (Config Server)
  # ============================
  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: truckbites-config
    restart: unless-stopped
    ports:
      - "8888:8888"
    depends_on:
      - eureka-server
    networks:
      - truckbites-network

  # ============================
  # Auth Service MySQL Database
  # ============================
  auth-mysql:
    image: mysql:8.0
    container_name: truckbites-auth-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: truckbites_auth_db
      MYSQL_ROOT_PASSWORD: truckbites_root
    ports:
      - "3308:3306"
    volumes:
      - auth_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ptruckbites_root"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - truckbites-network

  # ============================
  # Auth Service
  # ============================
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: truckbites-auth-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://auth-mysql:3306/truckbites_auth_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: truckbites_root
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    depends_on:
      auth-mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
    networks:
      - truckbites-network

  # ============================
  # User Service MySQL Database
  # ============================
  user-mysql:
    image: mysql:8.0
    container_name: truckbites-user-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: truckbites_users_db
      MYSQL_ROOT_PASSWORD: truckbites_root
    ports:
      - "3309:3306"
    volumes:
      - user_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ptruckbites_root"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - truckbites-network

  # ============================
  # User Service
  # ============================
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: truckbites-user-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://user-mysql:3306/truckbites_users_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: truckbites_root
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    depends_on:
      user-mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
    networks:
      - truckbites-network

  # ============================
  # Legacy Monolith Backend
  # ============================
  backend:
    build:
      context: ./truckbites-backend
      dockerfile: Dockerfile
    container_name: truckbites-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/truckbites_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: truckbites_root
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - truckbites-network

volumes:
  mysql_data:
    name: truckbites_mysql_data
  auth_mysql_data:
    name: truckbites_auth_mysql_data
  user_mysql_data:
    name: truckbites_user_mysql_data

networks:
  truckbites-network:
    name: truckbites-network
    driver: bridge

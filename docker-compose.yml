version: "3.8"

services:
  # =====================
  # Shared MySQL Database
  # =====================
  mysql:
    image: mysql:8.0
    container_name: truckbites-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: truckbites_db
      MYSQL_ROOT_PASSWORD: truckbites_root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ptruckbites_root"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - truckbites-network

  # ===========================
  # Service Discovery (Eureka)
  # ===========================
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: truckbites-eureka
    restart: unless-stopped
    ports:
      - "8761:8761"
    networks:
      - truckbites-network

  # ============================
  # Centralized Config (Config Server)
  # ============================
  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: truckbites-config
    restart: unless-stopped
    ports:
      - "8888:8888"
    depends_on:
      - eureka-server
    networks:
      - truckbites-network

  # ============================
  # Auth Service MySQL Database
  # ============================
  auth-mysql:
    image: mysql:8.0
    container_name: truckbites-auth-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: truckbites_auth_db
      MYSQL_ROOT_PASSWORD: truckbites_root
    ports:
      - "3308:3306"
    volumes:
      - auth_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ptruckbites_root"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - truckbites-network

  # ============================
  # Auth Service
  # ============================
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: truckbites-auth-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://auth-mysql:3306/truckbites_auth_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: truckbites_root
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    depends_on:
      auth-mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
    networks:
      - truckbites-network

  # ============================
  # User Service MySQL Database
  # ============================
  user-mysql:
    image: mysql:8.0
    container_name: truckbites-user-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: truckbites_users_db
      MYSQL_ROOT_PASSWORD: truckbites_root
    ports:
      - "3309:3306"
    volumes:
      - user_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ptruckbites_root"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - truckbites-network

  # ============================
  # User Service
  # ============================
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: truckbites-user-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://user-mysql:3306/truckbites_users_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: truckbites_root
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    depends_on:
      user-mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
    networks:
      - truckbites-network

  # ============================
  # Truck Service MySQL Database
  # ============================
  truck-mysql:
    image: mysql:8.0
    container_name: truckbites-truck-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: truckbites_truck_db
      MYSQL_ROOT_PASSWORD: truckbites_root
    ports:
      - "3310:3306"
    volumes:
      - truck_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ptruckbites_root"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - truckbites-network

  # ============================
  # Menu Service MySQL Database
  # ============================
  menu-mysql:
    image: mysql:8.0
    container_name: truckbites-menu-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: truckbites_menu_db
      MYSQL_ROOT_PASSWORD: truckbites_root
    ports:
      - "3311:3306"
    volumes:
      - menu_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ptruckbites_root"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - truckbites-network

  # ============================
  # Truck Service
  # ============================
  truck-service:
    build:
      context: ./truck-service
      dockerfile: Dockerfile
    container_name: truckbites-truck-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://truck-mysql:3306/truckbites_truck_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: truckbites_root
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    depends_on:
      truck-mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
    networks:
      - truckbites-network

  # ============================
  # Menu Service
  # ============================
  menu-service:
    build:
      context: ./menu-service
      dockerfile: Dockerfile
    container_name: truckbites-menu-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://menu-mysql:3306/truckbites_menu_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: truckbites_root
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    depends_on:
      menu-mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
      truck-service:
        condition: service_started
    networks:
      - truckbites-network

  # ============================
  # Order Service MySQL Database
  # ============================
  order-mysql:
    image: mysql:8.0
    container_name: truckbites-order-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: order_db
      MYSQL_ROOT_PASSWORD: truckbites_root
    ports:
      - "3312:3306"
    volumes:
      - order_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ptruckbites_root"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - truckbites-network

  # ============================
  # Order Service
  # ============================
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: truckbites-order-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://order-mysql:3306/order_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: truckbites_root
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    depends_on:
      order-mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
      menu-service:
        condition: service_started
    networks:
      - truckbites-network

volumes:
  mysql_data:
    name: truckbites_mysql_data
  auth_mysql_data:
    name: truckbites_auth_mysql_data
  user_mysql_data:
    name: truckbites_user_mysql_data
  truck_mysql_data:
    name: truckbites_truck_mysql_data
  menu_mysql_data:
    name: truckbites_menu_mysql_data
  order_mysql_data:
    name: truckbites_order_mysql_data

networks:
  truckbites-network:
    name: truckbites-network
    driver: bridge

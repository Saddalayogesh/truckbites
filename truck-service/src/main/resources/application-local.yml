server:
  port: 8083

spring:
  datasource:
    url: jdbc:h2:mem:truckbites_truck_db;INIT=CREATE SCHEMA IF NOT EXISTS truckbites_truck_db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

spring:
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true


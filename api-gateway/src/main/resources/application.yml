server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns:
                  - "*"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - Authorization
                  - Content-Type
                  - X-Requested-With
                allow-credentials: true
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
            - id: truck-service
              uri: lb://truck-service
              predicates:
                - Path=/api/trucks/**
            - id: favorites-service
              uri: lb://truck-service
              predicates:
                - Path=/api/favorites/**
            - id: reviews-service
              uri: lb://truck-service
              predicates:
                - Path=/api/reviews/**
            - id: menu-service
              uri: lb://menu-service
              predicates:
                - Path=/api/menu/**
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/**
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**
            - id: analytics-service
              uri: lb://analytics-service
              predicates:
                - Path=/api/analytics/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

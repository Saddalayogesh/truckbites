server:
  port: 8087

spring:
  mail:
    host: smtp.mailtrap.io
    port: 587
    username: ${MAILTRAP_USERNAME}
    password: ${MAILTRAP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        transport:
          protocol: smtp
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest

app:
  rabbitmq:
    exchange: truckbites.exchange
    routing-key:
      order-placed: order.placed
      order-paid: order.paid
    queue:
      notification: notification.queue

jwt:
  secret: ${JWT_SECRET}

# Mail health check requires SMTP credentials; without Mailtrap creds the
# actuator /health would report DOWN and block docker compose dependency
# chains. Disable it so the service stays healthy even without mail config.
management:
  health:
    mail:
      enabled: false

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

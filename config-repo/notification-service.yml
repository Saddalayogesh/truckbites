server:
  port: 8087

spring:
  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${BREVO_SMTP_LOGIN}
    password: ${BREVO_SMTP_KEY}
    from: ${MAIL_FROM}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        transport:
          protocol: smtp
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest

app:
  # Base URL used for email CTA links (e.g. "Track your order"). Override
  # with FRONTEND_URL when deploying (e.g. https://truckbites.app).
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  rabbitmq:
    exchange: truckbites.exchange
    routing-key:
      order-placed: order.placed
      order-paid: order.paid
    queue:
      notification: notification.queue

jwt:
  secret: ${JWT_SECRET}

# Mail health check requires SMTP credentials; without Brevo creds the
# actuator /health would report DOWN and block docker compose dependency
# chains. Disable it so the service stays healthy even without mail config.
management:
  health:
    mail:
      enabled: false

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

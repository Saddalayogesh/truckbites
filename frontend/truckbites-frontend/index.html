<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply saved theme before first paint to avoid a flash of the wrong theme.
      // Modes: 'light' | 'dark' | 'system' — new visitors (no saved value) default to light.
      try {
        var t = localStorage.getItem('tb-theme');
        var dark = false;
        if (t === 'dark') {
          dark = true;
        } else if (t === 'system') {
          dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        if (dark) {
          document.documentElement.classList.add('dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#1F1814');
        }
      } catch (e) {}
    </script>
    <meta name="theme-color" content="#FCF8F4" />
    <meta
      name="description"
      content="TruckBites — Hyderabad's food truck marketplace. Fresh, fast, and on wheels."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>TruckBites — Great food, on wheels</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

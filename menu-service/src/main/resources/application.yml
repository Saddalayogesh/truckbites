server:
  port: 8084

spring:
  datasource:
    url: jdbc:mysql://localhost:3311/truckbites_menu_db
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD:-truckbites_root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

jwt:
  secret: ${JWT_SECRET}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
